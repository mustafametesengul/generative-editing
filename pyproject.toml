[project]
name = "generative-editing"
version = "0.1.0"
description = "Perception-guided selective weather editing prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.40.0",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
]

[project.scripts]
generative-editing = "generative_editing:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
